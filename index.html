<title>Keycap Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: one narrow column of keyboard-like panels; tasks are keycaps you press down. */
  :root {
    --bg: #eef0f4;
    --panel: #ffffff;
    --fg: #1d2230;
    --muted: #5f6678;
    --line: #d6dae3;
    --key: #f7f8fa;
    --key-edge: #c4c9d4;
    --accent: #e0662a;
    --accent-ink: #ffffff;
    --done: #2f8a5b;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171f; --panel: #1c2029; --fg: #e9ecf2; --muted: #9aa2b4; --line: #2c3240;
      --key: #252a35; --key-edge: #0c0e13; --accent: #f08048; --accent-ink: #1a0d05; --done: #5cc48d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171f; --panel: #1c2029; --fg: #e9ecf2; --muted: #9aa2b4; --line: #2c3240;
    --key: #252a35; --key-edge: #0c0e13; --accent: #f08048; --accent-ink: #1a0d05; --done: #5cc48d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 48px;
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }
  header { display: grid; gap: 4px; }
  .eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 800 clamp(34px, 9vw, 48px)/1.05 var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: var(--accent); }
  h2 { font: 500 20px/1.2 var(--display); margin: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .count { font: 500 13px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  input[type="text"]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn {
    font: 700 15px/1 var(--body); border: 0; border-radius: 10px; padding: 0 18px; min-height: 46px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { display: flex; gap: 10px; align-items: center; }
  .keycap {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left;
    font: inherit; color: var(--fg); cursor: pointer;
    background: var(--key); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; box-shadow: 0 4px 0 var(--key-edge);
    transform: translateY(0); transition: transform .08s, box-shadow .08s;
  }
  .keycap:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--key-edge); }
  .keycap .box {
    flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted);
    display: grid; place-items: center; font: 700 14px/1 var(--mono); color: transparent;
  }
  .keycap .text { overflow-wrap: anywhere; }
  li.done .keycap { transform: translateY(3px); box-shadow: 0 1px 0 var(--key-edge); }
  li.done .box { border-color: var(--done); background: var(--done); color: var(--panel); }
  li.done .text { color: var(--muted); text-decoration: line-through; }
  .del {
    flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font: 500 18px/1 var(--mono); cursor: pointer;
  }
  .empty { color: var(--muted); margin: 0; }

  .timer { font: 800 clamp(56px, 18vw, 80px)/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .bar { height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: var(--accent); transition: width .5s linear; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font: 500 13px/1 var(--mono); padding: 8px 10px; border-radius: 99px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }
  footer { color: var(--muted); font-size: 13px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main>
  <header>
    <span class="eyebrow" id="date">Today</span>
    <h1 id="greeting">Good day, <em>qwertycoo</em></h1>
  </header>

  <section class="panel" aria-labelledby="tasks-h">
    <div class="row">
      <h2 id="tasks-h">Today's keys</h2>
      <span class="count" id="count">0 / 0 done</span>
    </div>
    <form id="add-form">
      <input type="text" id="new-task" placeholder="Add a task…" autocomplete="off" aria-label="New task">
      <button class="btn" type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <p class="empty" id="empty" hidden>Nothing left. Add a task above.</p>
  </section>

  <section class="panel" aria-labelledby="focus-h">
    <div class="row">
      <h2 id="focus-h">Focus timer</h2>
      <div class="chips" role="group" aria-label="Timer length">
        <button class="chip" type="button" data-min="5" aria-pressed="false">5m</button>
        <button class="chip" type="button" data-min="15" aria-pressed="false">15m</button>
        <button class="chip" type="button" data-min="25" aria-pressed="true">25m</button>
      </div>
    </div>
    <div class="timer" id="clock" aria-live="polite">25:00</div>
    <div class="bar"><div id="progress"></div></div>
    <div class="controls">
      <button class="btn" type="button" id="start">Start</button>
      <button class="btn ghost" type="button" id="reset">Reset</button>
    </div>
  </section>

  <footer>Tasks are saved on this device only.</footer>
</main>

<script>
(function () {
  var KEY = "keycap-planner-tasks";
  var sample = [
    { text: "Drink a glass of water", done: true },
    { text: "Reply to messages", done: false },
    { text: "20 minutes of reading", done: false }
  ];

  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return sample.slice();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} }

  var tasks = load();
  var list = document.getElementById("list");
  var empty = document.getElementById("empty");
  var count = document.getElementById("count");

  function render() {
    list.innerHTML = "";
    tasks.forEach(function (t, i) {
      var li = document.createElement("li");
      if (t.done) li.className = "done";
      var key = document.createElement("button");
      key.type = "button"; key.className = "keycap";
      key.setAttribute("aria-pressed", t.done ? "true" : "false");
      var box = document.createElement("span"); box.className = "box"; box.textContent = "✓";
      var txt = document.createElement("span"); txt.className = "text"; txt.textContent = t.text;
      key.append(box, txt);
      key.addEventListener("click", function () { t.done = !t.done; save(); render(); });
      var del = document.createElement("button");
      del.type = "button"; del.className = "del"; del.textContent = "×";
      del.setAttribute("aria-label", "Delete " + t.text);
      del.addEventListener("click", function () { tasks.splice(i, 1); save(); render(); });
      li.append(key, del);
      list.appendChild(li);
    });
    var done = tasks.filter(function (t) { return t.done; }).length;
    count.textContent = done + " / " + tasks.length + " done";
    empty.hidden = tasks.length > 0;
  }

  document.getElementById("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("new-task");
    var v = input.value.trim();
    if (!v) return;
    tasks.push({ text: v, done: false });
    input.value = ""; save(); render();
  });

  // Greeting and date
  var now = new Date(), h = now.getHours();
  var part = h < 5 ? "Up late" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  document.getElementById("greeting").innerHTML = part + ", <em>qwertycoo</em>";
  document.getElementById("date").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  // Focus timer
  var total = 25 * 60, left = total, timer = null;
  var clock = document.getElementById("clock"), bar = document.getElementById("progress"), startBtn = document.getElementById("start");
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
  function paint() { clock.textContent = fmt(left); bar.style.width = ((total - left) / total * 100) + "%"; }
  function stop() { clearInterval(timer); timer = null; startBtn.textContent = left === 0 ? "Done" : "Start"; }
  startBtn.addEventListener("click", function () {
    if (timer) { stop(); startBtn.textContent = "Resume"; return; }
    if (left === 0) left = total;
    startBtn.textContent = "Pause";
    timer = setInterval(function () { left--; paint(); if (left <= 0) { left = 0; stop(); } }, 1000);
  });
  document.getElementById("reset").addEventListener("click", function () { stop(); left = total; paint(); });
  document.querySelectorAll(".chip").forEach(function (c) {
    c.addEventListener("click", function () {
      document.querySelectorAll(".chip").forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
      c.setAttribute("aria-pressed", "true");
      stop(); total = left = Number(c.dataset.min) * 60; paint();
    });
  });

  render(); paint();
})();
</script>
